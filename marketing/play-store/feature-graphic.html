<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PMT Arcade feature graphic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "Nirmala UI", "Segoe UI", Arial, sans-serif; color: #fff;
    background: radial-gradient(ellipse at 20% 30%, rgba(139,92,246,.5), transparent 60%),
                linear-gradient(135deg, #0b1020 0%, #1e1b4b 55%, #0e7490 100%);
    display: flex; align-items: center; padding: 0 56px; gap: 44px;
  }
  .left { flex: 1; }
  .head { display: flex; align-items: center; gap: 22px; }
  .head svg { width: 120px; height: 120px; flex: none; }
  .brand { font: 900 54px/1 "Arial Black"; white-space: nowrap, Arial, sans-serif; letter-spacing: -1px; }
  h1 { margin-top: 26px; font-size: 30px; font-weight: 700; line-height: 1.25; }
  h1 b { color: #fbbf24; }
  .bn { margin-top: 12px; font-size: 26px; color: #c7d2fe; }
  .games { display: grid; grid-template-columns: repeat(2, 150px); gap: 16px; }
  .g { border-radius: 20px; overflow: hidden; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16); }
  .g img { display: block; width: 100%; height: 120px; object-fit: cover; }
  .g div { padding: 6px 4px 8px; font-size: 20px; font-weight: 700; text-align: center; }
</style>
</head>
<body>
  <div class="left">
    <div class="head">
      <svg viewBox="-340 -340 680 680">
        <defs>
          <radialGradient id="rim" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#f5b82e"/><stop offset="1" stop-color="#a85d06"/></radialGradient>
          <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
        </defs>
        <circle r="330" fill="url(#rim)"/><circle r="275" fill="url(#face)"/>
        <path d="M0 -205 L140 -45 L0 115 L-140 -45 Z" fill="#fff"/>
        <text y="225" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="112" fill="#fff" letter-spacing="8">PMT</text>
      </svg>
      <div class="brand">PMT Arcade</div>
    </div>
    <h1>Ludo · Carrom · Chess · 29 · Call Bridge<br><b>with friends — and voice chat</b></h1>
    <div class="bn">বন্ধুদের সাথে লুডু ও কার্ড গেম, কথা বলতে বলতে</div>
  </div>
  <div class="games">
    <div class="g"><img src="../../apps/web/public/games/ludo.svg"><div>Ludo</div></div>
    <div class="g"><img src="../../apps/web/public/games/carrom.svg"><div>Carrom</div></div>
    <div class="g"><img src="../../apps/web/public/games/twenty-nine.svg"><div>29</div></div>
    <div class="g"><img src="../../apps/web/public/games/chess.svg"><div>Chess</div></div>
  </div>
</body>
</html>
