<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#f5b82e"/><stop offset="1" stop-color="#a85d06"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- coin kept well inside the circle Facebook crops to -->
  <g transform="translate(512 470) scale(0.9)">
    <circle r="330" fill="url(#rim)"/>
    <circle r="330" fill="none" stroke="#7c4a03" stroke-opacity=".35" stroke-width="8"/>
    <circle r="275" fill="url(#face)"/>
    <circle r="275" fill="none" stroke="#fde68a" stroke-opacity=".7" stroke-width="6"/>
    <path d="M0 -205 L140 -45 L0 115 L-140 -45 Z" fill="url(#gem)"/>
    <path d="M0 -205 L140 -45 L0 -45 Z" fill="#c7d2fe" opacity=".55"/>
    <path d="M0 -45 L0 115 L-140 -45 Z" fill="#a5b4fc" opacity=".35"/>
    <text y="225" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="112" fill="#ffffff" letter-spacing="8">PMT</text>
  </g>

  <g transform="translate(512 880)">
    <rect x="-270" y="-44" width="540" height="76" rx="38" fill="#f5b82e"/>
    <text y="10" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#0b1020" letter-spacing="1">pmtarcade.com</text>
  </g>
</svg>
