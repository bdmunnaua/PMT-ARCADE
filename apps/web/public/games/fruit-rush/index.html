      if (f.kind === 'pop') { const k = f.t / 0.22; drawTile(f.tile, BX + f.x * CS, BY + f.y * CS, 1 + k * 0.4, 1 - k); }
      else {
        const k = f.t / 0.4; ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - k)})`;
        if (f.kind === 'row') ctx.fillRect(BX, BY + f.r * CS + CS * 0.3, N * CS, CS * 0.4);
        if (f.kind === 'col') ctx.fillRect(BX + f.c * CS + CS * 0.3, BY, CS * 0.4, N * CS);
        if (f.kind === 'bomb') { ctx.beginPath(); ctx.arc(BX + (f.c + 0.5) * CS, BY + (f.r + 0.5) * CS, CS * (0.5 + k * 1.6), 0, 6.28); ctx.fill(); }
      }
    }
    ctx.restore();
    // knife button
    const kb = knifeBtn();
    ctx.fillStyle = knifeMode ? '#fbbf24' : knives ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
    ctx.strokeStyle = knifeMode ? '#fde68a' : 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(kb.x, kb.y, kb.w, kb.h, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = knifeMode ? '#2a1a00' : knives ? '#fff' : 'rgba(255,255,255,0.35)'; ctx.font = `600 16px Outfit, ${EMOJI_FONT}`; ctx.textBaseline = 'middle';
    const label = knifeMode ? 'Tap a fruit to cut' : `Knife × ${knives}`, tw = ctx.measureText(label).width;
    if (knifeImg.complete && knifeImg.naturalWidth) { ctx.globalAlpha = knives || knifeMode ? 1 : 0.4; ctx.drawImage(knifeImg, 200 - tw / 2 - 16, kb.y + kb.h / 2 - 11, 22, 22); ctx.globalAlpha = 1; ctx.fillText(label, 200 + 12, kb.y + kb.h / 2 + 1); }
    else ctx.fillText(label, 200, kb.y + kb.h / 2 + 1);
  }
  function loop(ts) {
    const dt = Math.min(0.033, (ts - (lastT || ts)) / 1000); lastT = ts;
    if (grid) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }

  Arcade.init({
    id: 'fruit-rush',
    subtitle: 'Swap fruits, make matches, reach each level goal.',
    howTo: ['<b>Swipe</b> a fruit (or tap two) to swap neighbours and make lines of 3+.', 'Match 4 makes a <b>line blaster</b>, an L/T shape makes a <b>bomb</b>, 5 in a row makes a <b>rainbow</b>.', 'Reach the level goal for <b>+10 moves</b>. Swaps that don’t match are free.', 'Use the 🔪 <b>knife</b> (3 per game) to cut any fruit without using a move.'],
    onStart() { reset(); },
  });
  view = Arcade.fitCanvas(canvas, { w: 400, h: BY + N * CS + 80 });
  ctx = view.ctx;
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
