<body>
<div id="stage"><canvas id="c"></canvas></div>
<script src="../../config.js"></script>
<script src="../sdk/sdk.js"></script>
<script>
(() => {
  const N = 8, CELL = 44, BOARD = N * CELL, BX = (400 - BOARD) / 2, BY = 16;
  const COLORS = [
    ['#c4b5fd', '#7c3aed'], ['#93c5fd', '#2563eb'], ['#6ee7b7', '#059669'], ['#fde68a', '#d97706'],
    ['#fda4af', '#e11d48'], ['#67e8f9', '#0891b2'], ['#fdba74', '#ea580c'], ['#f0abfc', '#c026d3'],
  ];
  const SHAPES = [
    { c: [[0,0]], w: 3 },
    { c: [[0,0],[1,0]], w: 5 }, { c: [[0,0],[0,1]], w: 5 },
    { c: [[0,0],[1,0],[2,0]], w: 6 }, { c: [[0,0],[0,1],[0,2]], w: 6 },
    { c: [[0,0],[1,0],[2,0],[3,0]], w: 4 }, { c: [[0,0],[0,1],[0,2],[0,3]], w: 4 },
    { c: [[0,0],[1,0],[2,0],[3,0],[4,0]], w: 2 }, { c: [[0,0],[0,1],[0,2],[0,3],[0,4]], w: 2 },
    { c: [[0,0],[1,0],[0,1],[1,1]], w: 6 },
    { c: [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]], w: 2 },
    { c: [[0,0],[0,1],[1,1]], w: 4 }, { c: [[1,0],[0,1],[1,1]], w: 4 }, { c: [[0,0],[1,0],[0,1]], w: 4 }, { c: [[0,0],[1,0],[1,1]], w: 4 },
    { c: [[0,0],[0,1],[0,2],[1,2],[2,2]], w: 2 }, { c: [[2,0],[2,1],[0,2],[1,2],[2,2]], w: 2 },
    { c: [[0,0],[1,0],[2,0],[0,1],[0,2]], w: 2 }, { c: [[0,0],[1,0],[2,0],[2,1],[2,2]], w: 2 },
    { c: [[0,0],[1,0],[2,0],[1,1]], w: 3 }, { c: [[1,0],[0,1],[1,1],[2,1]], w: 3 },
    { c: [[0,0],[0,1],[0,2],[1,1]], w: 3 }, { c: [[1,0],[1,1],[1,2],[0,1]], w: 3 },
    { c: [[0,0],[1,0],[1,1],[2,1]], w: 3 }, { c: [[1,0],[2,0],[0,1],[1,1]], w: 3 },
    { c: [[0,0],[0,1],[0,2],[1,0]], w: 3 }, { c: [[0,0],[1,0],[1,1],[1,2]], w: 3 },
  ];
  const TOTAL_W = SHAPES.reduce((s, x) => s + x.w, 0);

  const canvas = document.getElementById('c');
  let view, ctx;
  let grid, tray, drag, clearing, particles, combo, placed, lines, running, lastT;

  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function drawCell(x, y, s, col, a = 1) {
    ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(x, y, x, y + s);
    g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
    ctx.fillStyle = g; rr(x + 1.5, y + 1.5, s - 3, s - 3, s * 0.2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; rr(x + s * 0.18, y + s * 0.12, s * 0.64, s * 0.16, s * 0.08); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; rr(x + s * 0.12, y + s * 0.78, s * 0.76, s * 0.1, s * 0.05); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function randomShape() {
    let r = Math.random() * TOTAL_W;
    for (const s of SHAPES) { if ((r -= s.w) < 0) return s; }
    return SHAPES[0];
  }
  function makePiece() {
    const s = randomShape();
    const w = Math.max(...s.c.map((p) => p[0])) + 1, h = Math.max(...s.c.map((p) => p[1])) + 1;
    return { cells: s.c, w, h, color: COLORS[(Math.random() * COLORS.length) | 0], used: false };
  }
  function canPlace(p, gx, gy) {
    for (const [x, y] of p.cells) {
      const X = gx + x, Y = gy + y;
      if (X < 0 || Y < 0 || X >= N || Y >= N || grid[Y][X]) return false;
    }
    return true;
  }
  function fitsAnywhere(p) {
    for (let y = 0; y <= N - p.h; y++) for (let x = 0; x <= N - p.w; x++) if (canPlace(p, x, y)) return true;
    return false;
  }
  function refill() {
    // Try a few times to deal at least one piece that fits — keeps the game fair.
    for (let t = 0; t < 12; t++) {
      tray = [makePiece(), makePiece(), makePiece()];
      if (tray.some(fitsAnywhere)) break;
    }
    layoutTray();
  }
  function layoutTray() {
    const ty = BY + BOARD + (view.h - (BY + BOARD)) / 2;
    tray.forEach((p, i) => { p.slotX = 400 * (i + 0.5) / 3; p.slotY = ty; });
  }
  const TRAY_S = 26;

  function reset() {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    clearing = []; particles = []; combo = 0; placed = 0; lines = 0; drag = null;
    refill();
    Arcade.setStat('combo', 'Combo', '0');
  }

  function dropTarget(p, px, py) {
    const x0 = px - (p.w * CELL) / 2, y0 = py - (p.h * CELL) / 2;
    const gx = Math.round((x0 - BX) / CELL), gy = Math.round((y0 - BY) / CELL);
    return canPlace(p, gx, gy) ? { gx, gy } : null;
  }
  function linesFor(p, gx, gy) {
    const g = grid.map((r) => r.slice());
    for (const [x, y] of p.cells) g[gy + y][gx + x] = 1;
    const rows = [], cols = [];
    for (let i = 0; i < N; i++) {
      if (g[i].every(Boolean)) rows.push(i);
      if (g.every((r) => r[i])) cols.push(i);
    }
    return { rows, cols };
  }

  function place(p, gx, gy) {
    for (const [x, y] of p.cells) grid[gy + y][gx + x] = p.color;
    p.used = true; placed++;
    Arcade.sfx('place'); Arcade.vibrate(10);
    let pts = p.cells.length;
    const { rows, cols } = linesFor({ cells: [], w: 0, h: 0 }, 0, 0);
    const n = rows.length + cols.length;
    if (n) {
      combo++; lines += n;
      const set = new Set();
      rows.forEach((r) => { for (let x = 0; x < N; x++) set.add(r * N + x); });
      cols.forEach((c) => { for (let y = 0; y < N; y++) set.add(y * N + c); });
      set.forEach((k) => {
        const x = k % N, y = (k / N) | 0, col = grid[y][x];
        clearing.push({ x, y, col, t: 0, d: (Math.abs(x - gx) + Math.abs(y - gy)) * 0.025 });
        grid[y][x] = null;
      });
      const gain = Math.round(set.size * 10 * (1 + 0.5 * (n - 1)) * (1 + 0.25 * (combo - 1)));
      pts += gain;
      Arcade.sfx('clear'); if (combo > 1) setTimeout(() => Arcade.sfx('combo', combo), 120);
      const c = view.toStage(BX + (gx + p.w / 2) * CELL, BY + (gy + p.h / 2) * CELL);
      Arcade.floatText(c.x, c.y, (combo > 1 ? `Combo ×${combo}  ` : '') + '+' + gain, combo > 1 ? '#fde68a' : '#fff');
      if (n >= 2) Arcade.vibrate(30);
      if (grid.every((r) => r.every((v) => !v))) { pts += 300; setTimeout(() => { const m = view.toStage(200, BY + BOARD / 2); Arcade.floatText(m.x, m.y, 'BOARD CLEAR +300', '#6ee7b7'); Arcade.sfx('level'); }, 250); }
    } else {
      combo = 0;
    }
    Arcade.setStat('combo', 'Combo', String(combo));
    Arcade.addScore(pts);
    if (tray.every((t) => t.used)) refill();
    const left = tray.filter((t) => !t.used);
    if (!left.some(fitsAnywhere)) {
      running = false;
      setTimeout(() => Arcade.gameOver(Arcade.score, { title: 'No more moves', stats: [['Lines', lines], ['Pieces', placed]], meta: { lines, placed } }), 650);
    }
  }

  /* ---------- Input ---------- */
  function trayHit(pt) {
    for (const p of tray) {
      if (p.used) continue;
      const w = p.w * TRAY_S, h = p.h * TRAY_S;
      if (Math.abs(pt.x - p.slotX) < Math.max(w / 2 + 18, 50) && Math.abs(pt.y - p.slotY) < Math.max(h / 2 + 18, 50)) return p;
    }
    return null;
  }
  const LIFT = 70; // piece floats above the finger so you can see where it goes
  canvas.addEventListener('pointerdown', (e) => {
    if (!Arcade.playing || !running) return;
    const pt = view.point(e), p = trayHit(pt);
    if (!p) return;
    canvas.setPointerCapture(e.pointerId);
    drag = { p, x: pt.x, y: pt.y - (e.pointerType === 'mouse' ? 0 : LIFT), lift: e.pointerType === 'mouse' ? 0 : LIFT, target: null };
    Arcade.sfx('click');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const pt = view.point(e);
    drag.x = pt.x; drag.y = pt.y - drag.lift;
    drag.target = dropTarget(drag.p, drag.x, drag.y);
  });
  function endDrag() {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.target && running) place(d.p, d.target.gx, d.target.gy); else if (running) Arcade.sfx('bad');
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', () => { drag = null; });

  /* ---------- Render ---------- */
  function draw(dt) {
    ctx.clearRect(0, 0, view.w, view.h);
    // board
    ctx.fillStyle = 'rgba(10,8,32,0.75)'; rr(BX - 8, BY - 8, BOARD + 16, BOARD + 16, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(167,139,250,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    let preview = null, hi = { rows: [], cols: [] };
    if (drag && drag.target) { preview = drag.target; hi = linesFor(drag.p, preview.gx, preview.gy); }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const px = BX + x * CELL, py = BY + y * CELL;
      const lit = hi.rows.includes(y) || hi.cols.includes(x);
      if (grid[y][x]) drawCell(px, py, CELL, grid[y][x]);
      else { ctx.fillStyle = lit ? 'rgba(253,230,138,0.16)' : 'rgba(255,255,255,0.045)'; rr(px + 2, py + 2, CELL - 4, CELL - 4, 8); ctx.fill(); }
      if (lit && grid[y][x]) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(px + 2, py + 2, CELL - 4, CELL - 4, 8); ctx.fill(); }
    }
    if (preview) for (const [x, y] of drag.p.cells) drawCell(BX + (preview.gx + x) * CELL, BY + (preview.gy + y) * CELL, CELL, drag.p.color, 0.4);
    // clearing animation
    clearing = clearing.filter((c) => {
      c.t += dt;
      const k = Math.max(0, c.t - c.d) / 0.28;
      if (k >= 1) {
        for (let i = 0; i < 4; i++) particles.push({ x: BX + (c.x + 0.5) * CELL, y: BY + (c.y + 0.5) * CELL, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.9) * 260, life: 0.6, col: c.col[0] });
        return false;
      }
      const s = CELL * (1 - k * 0.6), off = (CELL - s) / 2;
      ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 18 * (1 - k);
      drawCell(BX + c.x * CELL + off, BY + c.y * CELL + off, s, k < 0.3 ? ['#ffffff', c.col[0]] : c.col, 1 - k * 0.5);
      ctx.restore();
      return true;
    });
    particles = particles.filter((p) => {
      p.life -= dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.fillStyle = p.col; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); ctx.globalAlpha = 1;
      return p.life > 0;
    });
    // tray
    for (const p of tray) {
      if (p.used || (drag && drag.p === p)) continue;
      const fits = fitsAnywhere(p);
      const x0 = p.slotX - (p.w * TRAY_S) / 2, y0 = p.slotY - (p.h * TRAY_S) / 2;
      for (const [x, y] of p.cells) drawCell(x0 + x * TRAY_S, y0 + y * TRAY_S, TRAY_S, p.color, fits ? 1 : 0.3);
    }
    if (drag) {
      const p = drag.p, x0 = drag.x - (p.w * CELL) / 2, y0 = drag.y - (p.h * CELL) / 2;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8;
      for (const [x, y] of p.cells) drawCell(x0 + x * CELL, y0 + y * CELL, CELL, p.color, 0.95);
      ctx.restore();
    }
  }
  function loop(t) {
    const dt = Math.min(0.05, (t - (lastT || t)) / 1000); lastT = t;
    if (grid) draw(dt);
    requestAnimationFrame(loop);
  }

  Arcade.init({
    id: 'block-fit',
    subtitle: 'Drag blocks onto the board. Fill a row or column to clear it.',
    howTo: ['Drag any of the 3 blocks onto the 8×8 board.', 'Fill a full <b>row</b> or <b>column</b> to clear it.', 'Clear several lines in a row for a <b>combo</b> bonus.', 'The game ends when no block fits.'],
    onStart() { reset(); running = true; },
  });
  view = Arcade.fitCanvas(canvas, { w: 400, minH: 560, maxH: 720, onResize: () => { if (tray) layoutTray(); } });
  ctx = view.ctx;
  reset(); running = false;
  requestAnimationFrame(loop);
})();
</script>
