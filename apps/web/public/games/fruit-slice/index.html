<body>
<div id="stage"><canvas id="c"></canvas></div>
<script src="../../config.js"></script>
<script src="../sdk/sdk.js"></script>
<script>
(() => {
  const W = 400, TW = 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/';
  // fruit art: Twemoji (CC-BY 4.0); juice colour per fruit
  const FRUITS = [
    { u: '1f349', juice: '#ef4444', r: 34 }, { u: '1f34a', juice: '#fb923c', r: 28 }, { u: '1f34e', juice: '#f87171', r: 27 },
    { u: '1f34d', juice: '#facc15', r: 32 }, { u: '1f95d', juice: '#84cc16', r: 25 }, { u: '1f351', juice: '#fda4af', r: 27 },
    { u: '1f34b', juice: '#fde047', r: 26 }, { u: '1f965', juice: '#f5f5f4', r: 28 },
  ];
  const imgs = {}; const load = (u) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.src = TW + u + '.svg'; imgs[u] = i; };
  FRUITS.forEach((f) => load(f.u)); load('1f4a3');

  const canvas = document.getElementById('c');
  let view, ctx, H = 700;
  let items, halves, splats, drops, trail, lives, t, waveT, alive, combo, comboT, sliced, lastT, bombFlash, swipe;

  function reset() {
    items = []; halves = []; splats = []; drops = []; trail = []; lives = 3; t = 0; waveT = 0.6; alive = true; combo = 0; comboT = 0; sliced = 0; bombFlash = 0;
    Arcade.setStat('lives', 'Lives', '❤❤❤');
  }
  function launch(bombChance) {
    const isBomb = Math.random() < bombChance;
    const f = isBomb ? { u: '1f4a3', r: 26, bomb: true } : FRUITS[(Math.random() * FRUITS.length) | 0];
    const x = 60 + Math.random() * (W - 120);
    const peak = H * (0.12 + Math.random() * 0.3);
    const vy = -Math.sqrt(2 * 980 * (H + 40 - peak));
    const vx = ((W / 2 - x) / W) * 260 + (Math.random() - 0.5) * 120;
    items.push({ ...f, x, y: H + 40, vx, vy, a: Math.random() * 6, va: (Math.random() - 0.5) * 5 });
    if (!isBomb) Arcade.sfx('whoosh');
  }
  function wave() {
    const level = Math.min(1, t / 120);
    const n = 1 + Math.floor(Math.random() * (2 + level * 4));
    const bombChance = t < 8 ? 0 : 0.1 + level * 0.12;
    for (let i = 0; i < n; i++) setTimeout(() => { if (alive && Arcade.playing) launch(bombChance); }, i * (140 + Math.random() * 200));
    waveT = Math.max(0.9, 2.2 - level * 1.2) + Math.random() * 0.6;
  }

  function lose(why) {
    if (!alive) return;
    alive = false;
    setTimeout(() => Arcade.gameOver(Arcade.score, { title: why, stats: [['Fruits', sliced]], meta: { sliced } }), 900);
  }
  function segCircle(ax, ay, bx, by, cx, cy, r) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    let k = ((cx - ax) * dx + (cy - ay) * dy) / l2; k = Math.max(0, Math.min(1, k));
    const px = ax + k * dx, py = ay + k * dy;
    return (px - cx) ** 2 + (py - cy) ** 2 < r * r;
  }
  function cut(ax, ay, bx, by) {
    const hit = [];
    items.forEach((it) => { if (!it.dead && segCircle(ax, ay, bx, by, it.x, it.y, it.r)) hit.push(it); });
    hit.forEach((it) => {
      it.dead = true;
      if (it.bomb) {
        bombFlash = 0.6; Arcade.sfx('hit'); Arcade.vibrate(150);
        for (let i = 0; i < 30; i++) { const a = Math.random() * 6.28, s = 100 + Math.random() * 400; drops.push({ x: it.x, y: it.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.8, c: i % 2 ? '#fde047' : '#f97316', r: 4 }); }
        lose('Boom! You hit a bomb');
        return;
      }
      sliced++;
      const ang = Math.atan2(by - ay, bx - ax);
      for (const side of [-1, 1]) halves.push({ u: it.u, x: it.x, y: it.y, r: it.r, vx: it.vx + Math.cos(ang + Math.PI / 2) * side * 90, vy: it.vy * 0.4 - 80, a: ang, va: side * 4, side });
      for (let i = 0; i < 14; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 260; drops.push({ x: it.x, y: it.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, c: it.juice, r: 2 + Math.random() * 3 }); }
      splats.push({ x: it.x, y: it.y, r: it.r * 1.3, c: it.juice, life: 1.6 });
      Arcade.addScore(1);
      Arcade.sfx('pop', Math.min(10, combo));
      combo++; comboT = 0.25;
    });
  }

  function update(dt) {
    bombFlash = Math.max(0, bombFlash - dt);
    drops = drops.filter((p) => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; return p.life > 0; });
    splats = splats.filter((s) => (s.life -= dt) > 0);
    trail = trail.filter((p) => (p.life -= dt) > 0);
    halves = halves.filter((h) => { h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 980 * dt; h.a += h.va * dt; return h.y < H + 80; });
    if (comboT > 0 && (comboT -= dt) <= 0) {
      if (combo >= 3) {
        Arcade.addScore(combo); Arcade.sfx('combo', combo);
        const s = view.toStage(W / 2, H * 0.3); Arcade.floatText(s.x, s.y, `${combo} FRUIT COMBO  +${combo}`, '#fde68a');
      }
      combo = 0;
    }
    if (!Arcade.playing) return;
    if (alive) { t += dt; if ((waveT -= dt) <= 0) wave(); }
    items.forEach((it) => { it.x += it.vx * dt; it.y += it.vy * dt; it.vy += 980 * dt; it.a += it.va * dt; if (it.x < it.r || it.x > W - it.r) it.vx *= -0.6; });
    items = items.filter((it) => {
      if (it.dead) return false;
      if (it.y > H + 60 && it.vy > 0) {
        if (!it.bomb && alive) {
          lives--; Arcade.sfx('bad'); Arcade.vibrate(30);
          Arcade.setStat('lives', 'Lives', '❤'.repeat(Math.max(0, lives)) + '♡'.repeat(3 - Math.max(0, lives)));
          if (lives <= 0) lose('Too many fruits dropped');
        }
        return false;
      }
      return true;
    });
  }
  function drawImg(u, x, y, r, a, half) {
    const im = imgs[u];
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    if (half) { ctx.beginPath(); ctx.rect(-r - 2, half < 0 ? -r - 2 : 0, r * 2 + 4, r + 2); ctx.clip(); }
    if (im && im.complete && im.naturalWidth) ctx.drawImage(im, -r, -r, r * 2, r * 2);
    else { ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.29); ctx.fill(); }
    if (half) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-r, -1.5, r * 2, 3); }
    ctx.restore();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    // wooden board planks
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.06)'; ctx.fillRect(0, (i * H) / 6, W, H / 6); }
    splats.forEach((s) => { ctx.globalAlpha = Math.min(0.55, s.life * 0.4); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.29); ctx.fill(); });
    ctx.globalAlpha = 1;
    halves.forEach((h) => drawImg(h.u, h.x, h.y, h.r, h.a, h.side));
    items.forEach((it) => {
      if (it.bomb) { ctx.save(); ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 18 + Math.sin(t * 20) * 8; drawImg(it.u, it.x, it.y, it.r, it.a); ctx.restore(); }
      else drawImg(it.u, it.x, it.y, it.r, it.a);
    });
    drops.forEach((p) => { ctx.globalAlpha = Math.max(0, p.life * 1.6); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill(); });
    ctx.globalAlpha = 1;
    // blade trail
    if (trail.length > 1) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 1; i < trail.length; i++) {
        const a = trail[i - 1], b = trail[i], k = b.life / 0.18;
        ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = 2 + 9 * k; ctx.shadowColor = '#bae6fd'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    if (bombFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${bombFlash})`; ctx.fillRect(0, 0, W, H); }
  }
  function loop(ts) {
    const dt = Math.min(0.033, (ts - (lastT || ts)) / 1000); lastT = ts;
    if (items) { update(dt); draw(); }
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown', (e) => { if (!Arcade.playing) return; canvas.setPointerCapture(e.pointerId); const p = view.point(e); swipe = p; trail.push({ ...p, life: 0.18 }); });
  canvas.addEventListener('pointermove', (e) => {
    if (!swipe || !Arcade.playing || !alive) return;
    const p = view.point(e);
    if (Math.hypot(p.x - swipe.x, p.y - swipe.y) > 2) { cut(swipe.x, swipe.y, p.x, p.y); swipe = p; trail.push({ ...p, life: 0.18 }); if (trail.length > 14) trail.shift(); }
  });
  const end = () => (swipe = null);
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

  Arcade.init({
    id: 'fruit-slice',
    subtitle: 'Swipe to slice the fruit. Never touch the bombs!',
    howTo: ['<b>Swipe</b> across the screen to slice flying fruit.', 'Slice 3 or more in one swipe for a <b>combo</b> bonus.', 'Touching a 💣 bomb ends the game.', 'Let 3 fruits fall and it’s over.'],
    onStart() { reset(); },
  });
  view = Arcade.fitCanvas(canvas, { w: W, minH: 620, maxH: 860, pad: 0, onResize: (v) => (H = v.h) });
  ctx = view.ctx; H = view.h;
  reset();
  requestAnimationFrame(loop);
})();
</script>
