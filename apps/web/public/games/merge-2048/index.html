<style>
  body { --game-bg: radial-gradient(120% 80% at 50% 0%, #3b2410 0%, #1a120b 55%, #0d0906 100%); }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .board {
    --gap: calc(var(--size) * 0.028); --cell: calc((var(--size) - var(--gap) * 5) / 4);
    position: relative; width: var(--size); height: var(--size); border-radius: calc(var(--size) * 0.045);
    background: linear-gradient(180deg, #3a2a1c, #2a1e14); padding: var(--gap);
    box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .slot, .tile { position: absolute; top: 0; left: 0; width: var(--cell); height: var(--cell); border-radius: calc(var(--cell) * 0.16); }
  .slot { background: rgba(255,255,255,.06); }
  .tile {
    display: grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums;
    transition: transform 110ms ease-in-out; will-change: transform; z-index: 2;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25);
  }
  .tile span { display: block; }
  .tile.new span { animation: appear 180ms ease 90ms backwards; }
  .tile.merged span { animation: merge 200ms ease 100ms; }
  .tile.merged { z-index: 3; }
  @keyframes appear { from { transform: scale(0); opacity: 0; } }
  @keyframes merge { 50% { transform: scale(1.22); } }
  .tip { color: rgba(255,255,255,.55); font-size: .85rem; }
</style>

<body>
<div id="stage"><div class="wrap"><div class="board" id="board"></div><div class="tip">Swipe or use arrow keys</div></div></div>
<script src="../../config.js"></script>
<script src="../sdk/sdk.js"></script>
<script>
(() => {
  const STYLE = {
    2: ['#fef3c7', '#fde68a', '#78350f'], 4: ['#fde68a', '#fcd34d', '#78350f'], 8: ['#fdba74', '#fb923c', '#fff'],
    16: ['#fb923c', '#f97316', '#fff'], 32: ['#f87171', '#ef4444', '#fff'], 64: ['#f43f5e', '#e11d48', '#fff'],
    128: ['#f0abfc', '#d946ef', '#fff'], 256: ['#c084fc', '#a855f7', '#fff'], 512: ['#a78bfa', '#7c3aed', '#fff'],
    1024: ['#818cf8', '#4f46e5', '#fff'], 2048: ['#fde047', '#eab308', '#422006'], 4096: ['#34d399', '#059669', '#fff'],
  };
  const boardEl = document.getElementById('board');
  let tiles, nextId, moves, won, busy, maxTile;

  function sizeBoard() {
    const r = boardEl.closest('.ag-stage').getBoundingClientRect();
    const size = Math.max(240, Math.min(r.width - 28, r.height - 70, 520));
    boardEl.style.setProperty('--size', size + 'px');
    render();
  }
  function posStyle(r, c) { return `translate(calc(var(--gap) + ${c} * (var(--cell) + var(--gap))), calc(var(--gap) + ${r} * (var(--cell) + var(--gap))))`; }

  function buildSlots() {
    boardEl.innerHTML = '';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const s = document.createElement('div'); s.className = 'slot'; s.style.transform = posStyle(r, c); boardEl.appendChild(s);
    }
  }
  function empty() { const out = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!tiles.some((t) => t.r === r && t.c === c && !t.gone)) out.push([r, c]); return out; }
  function spawn() {
    const e = empty(); if (!e.length) return;
    const [r, c] = e[(Math.random() * e.length) | 0];
    tiles.push({ id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r, c, isNew: true });
  }

  function render() {
    const alive = new Set();
    for (const t of tiles) {
      alive.add(String(t.id));
      let d = boardEl.querySelector(`[data-id="${t.id}"]`);
      if (!d) { d = document.createElement('div'); d.className = 'tile'; d.dataset.id = t.id; d.innerHTML = '<span></span>'; boardEl.appendChild(d); }
      const st = STYLE[t.v] || ['#1f2937', '#111827', '#fde68a'];
      d.style.background = `linear-gradient(160deg, ${st[0]}, ${st[1]})`; d.style.color = st[2];
      const digits = String(t.v).length;
      d.style.fontSize = `calc(var(--cell) * ${digits <= 2 ? 0.46 : digits === 3 ? 0.38 : 0.3})`;
      d.querySelector('span').textContent = t.v;
      d.style.transform = posStyle(t.r, t.c);
      d.classList.toggle('new', !!t.isNew); d.classList.toggle('merged', !!t.merged);
      if (t.merged || t.isNew) { const s = d.querySelector('span'); s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; }
    }
    boardEl.querySelectorAll('.tile').forEach((d) => { if (!alive.has(d.dataset.id)) d.remove(); });
  }

  function move(dir) {
    if (!Arcade.playing || busy) return;
    const vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
    tiles = tiles.filter((t) => !t.gone);
    tiles.forEach((t) => { t.isNew = false; t.merged = false; });
    const at = (r, c) => tiles.find((t) => t.r === r && t.c === c && !t.gone);
    const order = [0, 1, 2, 3];
    const rows = vec[0] === 1 ? [...order].reverse() : order;
    const cols = vec[1] === 1 ? [...order].reverse() : order;
    let moved = false, gained = 0, merges = 0;
    const mergedInto = new Set();
    for (const r of rows) for (const c of cols) {
      const t = at(r, c); if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + vec[0], tc = nc + vec[1];
        if (tr < 0 || tr > 3 || tc < 0 || tc > 3) break;
        const o = at(tr, tc);
        if (!o) { nr = tr; nc = tc; continue; }
        if (o.v === t.v && !mergedInto.has(o.id)) {
          t.r = tr; t.c = tc; t.gone = true; o.v *= 2; o.merged = true; mergedInto.add(o.id);
          gained += o.v; merges++; moved = true; if (o.v > maxTile) maxTile = o.v;
          if (o.v === 2048 && !won) { won = true; setTimeout(() => { Arcade.sfx('level'); Arcade.confetti(); }, 150); }
        }
        break;
      }
      if (!t.gone && (nr !== r || nc !== c)) { t.r = nr; t.c = nc; moved = true; }
    }
    if (!moved) { Arcade.sfx('bad'); return; }
    moves++;
    busy = true;
    render();
    if (merges) { Arcade.sfx('pop', Math.log2(maxTile)); Arcade.vibrate(8); } else Arcade.sfx('move');
    setTimeout(() => {
      tiles = tiles.filter((t) => !t.gone);
      spawn(); render(); busy = false;
      Arcade.addScore(gained);
      Arcade.setStat('max', 'Tile', String(maxTile));
      if (!canMove()) setTimeout(() => Arcade.gameOver(Arcade.score, { title: won ? 'Well played!' : 'No moves left', win: won, stats: [['Best tile', maxTile], ['Moves', moves]], meta: { maxTile, moves } }), 500);
    }, 115);
  }
  function canMove() {
    if (tiles.length < 16) return true;
    const g = {}; tiles.forEach((t) => (g[t.r * 4 + t.c] = t.v));
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const v = g[r * 4 + c];
      if (c < 3 && g[r * 4 + c + 1] === v) return true;
      if (r < 3 && g[(r + 1) * 4 + c] === v) return true;
    }
    return false;
  }

  function reset() {
    tiles = []; nextId = 1; moves = 0; won = false; busy = false; maxTile = 2;
    buildSlots(); spawn(); spawn(); render();
    Arcade.setStat('max', 'Tile', '2');
  }

  window.addEventListener('keydown', (e) => {
    const k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' }[e.key];
    if (k) { e.preventDefault(); move(k); }
  });
  let sx = 0, sy = 0, tracking = false;
  const stage = document.getElementById('stage');
  stage.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; tracking = true; });
  stage.addEventListener('pointerup', (e) => {
    if (!tracking) return; tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  Arcade.init({
    id: 'merge-2048',
    subtitle: 'Slide the tiles. Merge equal numbers. Reach 2048!',
    howTo: ['<b>Swipe</b> (or arrow keys) to slide every tile.', 'Two equal tiles that touch <b>merge</b> into one.', 'Each merge adds its value to your score.', 'The game ends when the board is full and nothing can merge.'],
    onStart() { reset(); },
  });
  reset();
  new ResizeObserver(sizeBoard).observe(stage);
})();
</script>
